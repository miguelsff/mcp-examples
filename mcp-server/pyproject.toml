[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-banco-demo"
version = "0.1.0"
description = "Servidor MCP de solicitudes ficticias con controles de acceso verificables."
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "PyJWT==2.15.1",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["bank_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

